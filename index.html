<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Kalkulator Instrumen">
<meta name="theme-color" content="#0b5fff">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Kalkulator Instrumen</title>
<style>
:root{--bg:#f2f4f8;--card:#fff;--ink:#101828;--mute:#667085;--line:#e4e7ec;--acc:#0b5fff;--err:#b42318;--field:#f9fafb;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0f17;--card:#151b27;--ink:#f2f4f7;--mute:#98a2b3;--line:#263041;--acc:#5b9bff;--err:#f97066;--field:#0f1520;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0b0f17;--card:#151b27;--ink:#f2f4f7;--mute:#98a2b3;--line:#263041;--acc:#5b9bff;--err:#f97066;--field:#0f1520;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif}
main{max-width:560px;margin:0 auto;padding:16px 16px 100px}
h1{font-size:24px;letter-spacing:-.02em;margin:6px 0 14px}
.seg{display:flex;gap:3px;background:var(--line);border-radius:11px;padding:3px;margin-bottom:14px}
.seg button{flex:1;min-height:40px;border:0;border-radius:9px;background:transparent;color:var(--mute);font-weight:600;font-size:14px;font-family:inherit}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.15)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.f{display:block;margin-bottom:12px}.f:last-child{margin-bottom:0}
.f>span,.lbl{display:block;font-size:11px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.row{display:flex;gap:8px;align-items:center}
input,select{width:100%;min-width:0;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--ink);font-size:18px;padding:0 12px;font-family:inherit;font-variant-numeric:tabular-nums}
.row input{flex:1}
.pm{flex:none;width:46px;min-height:46px;border:1px solid var(--line);border-radius:12px;background:var(--field);color:var(--acc);font-size:20px;font-weight:700}
.u{flex:none;font-style:normal;color:var(--mute);font-size:14px;font-weight:600;min-width:28px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{font-size:36px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.big i{font-style:normal;font-size:16px;color:var(--mute);font-weight:600}
.r{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
.r:last-child{border-bottom:0}.r small{display:block;color:var(--mute);font-size:12px}
.v{font-size:18px;font-weight:600;text-align:right;font-variant-numeric:tabular-nums}
.v i{font-style:normal;color:var(--mute);font-size:13px;margin-left:4px}
.bad{color:var(--err);font-size:14px;font-weight:500}
.warn{border-left:3px solid var(--err);padding:6px 10px;color:var(--err);font-size:13px;margin-top:10px}
.note{color:var(--mute);font-size:12px;margin:6px 2px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));z-index:5}
nav button{flex:1;min-height:52px;border:0;background:transparent;color:var(--mute);font-size:12px;font-weight:600;font-family:inherit;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
nav button b{font-size:18px}nav button.on{color:var(--acc)}
</style>
</head>

 const f=s.dir==='s2p',o=f?scale(i,a,b,c,d):scale(i,c,d,a,b),pct=f?scale(i,a,b,0,100):scale(i,c,d,0,100);

 let w='';const sv=f?i:o;
 if(pct<0||pct>100)w+='<div class="warn">Di luar rentang 0–100 %. Nilai tetap dihitung (tidak dibatasi).</div>';
 if(s.su==='mA'&&a===4&&b===20&&(sv<3.8||sv>20.5))w+='<div class="warn">Di luar batas NAMUR NE 43 (3,8–20,5 mA): periksa sensor atau loop.</div>';
 return `<div class="lbl">OUT</div><div class="big">${fmt(o,4)} <i>${esc(f?s.pu:s.su)}</i></div><div class="note">${fmt(pct,2)} % dari span</div>${w}`}
const rg=ty=>{const r=TC[ty];return `${fmt(r[0].min,0)} … ${fmt(r[r.length-1].max,0)} °C`};
const rgm=ty=>{const r=INV[ty];return `${fmt(r[0].min,3)} … ${fmt(r[r.length-1].max,3)} mV`};
function calcTc(){const s=S.tc,cj=num(s.cj);let h='';
 if(s.mode==='t2mv'){const v=num(s.t);if(isNaN(v)||isNaN(cj))return '<p class="bad">Lengkapi semua angka.</p>';const t=toC(v,s.tu);
  h=`<div class="note">${fmt(t,2)} °C · ${fmt(fromC(t,'°F'),2)} °F · ${fmt(fromC(t,'K'),2)} K</div>`;
  for(const ty of TYPES){const x=tcT2mV(ty,t,cj);h+=row('Type '+ty,rg(ty),x===null?null:fmt(x,4),'mV')}}
 else{const v=num(s.mv);if(isNaN(v)||isNaN(cj))return '<p class="bad">Lengkapi semua angka.</p>';
  for(const ty of TYPES){const x=tcMV2T(ty,v,cj);h+=row('Type '+ty,rgm(ty),x===null?null:fmt(fromC(x,s.ou),2),s.ou)}}
 return h}
function calcRtd(){const s=S.rtd;let h='';
 if(s.mode==='t2r'){const v=num(s.t);if(isNaN(v))return '<p class="bad">Lengkapi angka.</p>';const t=toC(v,s.tu);
  h=`<div class="note">${fmt(t,2)} °C · ${fmt(fromC(t,'°F'),2)} °F</div>`;
  for(const r0 of [100,500,1000]){const x=rtdR(r0,t);h+=row('Pt'+r0,'R0 = '+r0+' Ω',x===null?null:fmt(x,3),'Ω')}}
 else{const r=num(s.r);if(isNaN(r))return '<p class="bad">Lengkapi angka.</p>';const t=rtdT(+s.s.slice(2),r);
  if(t===null)return '<p class="bad">Di luar rentang −200 … 850 °C.</p>';
  h=`<div class="lbl">Suhu</div><div class="big">${fmt(t,3)} <i>°C</i></div><div class="note">${fmt(fromC(t,'°F'),2)} °F · ${fmt(fromC(t,'K'),2)} K</div>`}
 return h}
function calc(){$('#res').innerHTML=({sig:calcSig,tc:calcTc,rtd:calcRtd})[tab]();save()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-seg],[data-tab],[data-pm]');if(!b)return;
 if(b.dataset.tab){tab=b.dataset.tab;view()}
 else if(b.dataset.seg){set(b.dataset.seg,b.dataset.v);view()}
 else{const p=b.dataset.pm,i=document.querySelector(`input[data-p="${p}"]`);let v=i.value.trim();v=v.startsWith('-')?v.slice(1):(v===''?'-':'-'+v);i.value=v;set(p,v);calc()}});
function onIn(e){const t=e.target,p=t.dataset&&t.dataset.p;if(!p)return;set(p,t.value);
 if(p==='sig.pre'&&PRE[t.value]){const q=PRE[t.value];S.sig.smin=String(q[0]);S.sig.smax=String(q[1]);S.sig.su=q[2]}
 if(e.type==='change'&&(p==='sig.pre'||p==='sig.pu'))view();else calc()}
document.addEventListener('input',onIn);document.addEventListener('change',onIn);
view();
if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));
</script>
